name: deployment
on:
  workflow_dispatch:
  pull_request:
     types:
       -opened

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: test frontend
        working-directory: ./FE
        run: |
          echo $(node -v)
          echo $(pwd)
          echo $(ls)
          npm ci
          npm run test
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build project
        run: |
          echo $(pwd)
          echo $(ls)
          cd ./FE
          echo $(pwd)
          echo $(ls)
          npm ci
          npm run build
